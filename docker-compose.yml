# Postgres local para desarrollo: `docker compose up -d db`. Credenciales solo de desarrollo.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mapa
      POSTGRES_PASSWORD: mapa
      POSTGRES_DB: mapa
    ports:
      - "5432:5432"
    volumes:
      - mapa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapa -d mapa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mapa-pgdata:
